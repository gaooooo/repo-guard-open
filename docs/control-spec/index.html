<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>控制面规范 · repo-guard</title>
<style>
:root{
  --bg:#07090d; --panel:#121922; --ink:#e8eef6; --muted:#8b9aab; --dim:#5c6d7e;
  --line:#243140; --line2:#3a5166;
  --facts:#5eead4; --red:#f87171; --graph:#7dd3fc; --proc:#fbbf24;
  --human:#c4b5fd; --merge:#86efac; --skill:#fb923c;
  --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans","Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{background-image:radial-gradient(900px 420px at 0 -10%,rgba(94,234,212,.07),transparent 50%),radial-gradient(800px 380px at 100% 0,rgba(196,181,253,.06),transparent 45%)}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);background:rgba(10,14,20,.92);padding:22px 14px 40px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 10px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--facts);text-transform:uppercase}
.brand h1{font-size:16px;margin:8px 0 0;letter-spacing:-.02em;line-height:1.35}
.menu{display:flex;flex-direction:column;gap:2px}
.menu .g{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim);padding:14px 10px 6px;text-transform:uppercase}
.menu a{display:flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;padding:8px 10px;border-radius:10px;font-size:13.5px;border:1px solid transparent}
.menu a:hover{color:var(--ink);background:#15202b}
.menu a.on{color:var(--ink);background:#18222e;border-color:var(--line2)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.main{padding:28px 40px 80px;max-width:980px}
section{margin:0 0 42px;scroll-margin-top:20px}
.lede{color:var(--muted);line-height:1.75;font-size:15.5px;max-width:820px}
.lede b{color:var(--ink)}
h2{font-size:22px;margin:0 0 8px;letter-spacing:-.02em}
h3{font-size:14px;margin:18px 0 8px}
.sub{color:var(--muted);font-size:13.5px;line-height:1.65;margin:0 0 14px}
.panel{background:linear-gradient(180deg,#16202b,#121922);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.beats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.beat{padding:12px;border:1px solid var(--line);border-radius:12px;background:#10171f;min-height:112px}
.beat .n{font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.beat p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
ol.tight,ul.tight{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px;line-height:1.7}
ol.tight li{margin:0 0 4px}
b.k{color:var(--ink)}
.tag{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.yes{color:var(--human)}.no{color:var(--dim)}.cfg{color:var(--proc)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;letter-spacing:.06em;font-family:var(--mono);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:top;line-height:1.55}
td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}
code{font-family:var(--mono);font-size:.92em;color:var(--facts)}
.note{margin-top:12px;padding:12px 14px;border-left:3px solid var(--human);background:rgba(196,181,253,.06);border-radius:0 10px 10px 0;color:var(--muted);font-size:13px;line-height:1.65}
.stop{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#10171f;margin:0 0 8px}
.stop .id{font-family:var(--mono);font-size:11px;padding-top:2px}
.doc{font-size:12.5px;color:var(--dim);margin-top:12px}
.doc a{color:var(--graph);text-decoration:none}
footer{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);color:var(--dim);font-size:12px;line-height:1.6}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .row,.beats{grid-template-columns:1fr}
  .main{padding:22px 18px 60px}
  td:first-child{white-space:normal}
}

.tree details{border-radius:8px}
.tree summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;color:var(--muted)}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover,.tree a:hover{background:#15202b;color:var(--ink)}
.tree .chev{font-family:var(--mono);font-size:10px;width:12px;color:var(--dim);display:inline-block}
.tree details[open] > summary .chev{transform:rotate(90deg)}
.tree .kids{padding:2px 0 6px 8px;margin-left:8px;border-left:1px solid var(--line)}
.tree a{display:block;color:var(--muted);text-decoration:none;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.tree a.on{color:var(--ink);background:#18222e;border-color:var(--line2)}
.page{display:none}
.page.on{display:block}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.card{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#10171f}
.card .n{color:var(--facts);font-size:13px;font-weight:600}
.card p{margin:6px 0 0;color:var(--muted);font-size:12.5px;line-height:1.55}
.sec{margin:18px 0 6px;font-size:13px;color:var(--ink);font-weight:600}
.mi{padding:8px 0;border-bottom:1px solid rgba(36,49,64,.8)}
.mi .t{color:var(--ink);font-size:13.5px;line-height:1.55}
.mi .v{color:var(--dim);font-size:12.5px;margin-top:4px;line-height:1.5}
.tree .g{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);padding:12px 8px 4px;text-transform:uppercase}

.ex{margin:0;padding-left:22px}.shell{grid-template-columns:300px 1fr}
.tree a{line-height:1.35}
.page-wrap{max-width:860px}
.md h1{font-size:26px;margin:0 0 12px}
.md h2{font-size:18px;margin:28px 0 10px;padding-top:8px;border-top:1px solid var(--line)}
.md h3{font-size:15px;margin:20px 0 8px}
.md p,.md li{color:var(--muted);line-height:1.75;font-size:14.5px}
.md blockquote{margin:0 0 16px;padding:10px 14px;border-left:3px solid var(--facts);background:rgba(94,234,212,.06);color:var(--ink);border-radius:0 10px 10px 0}
.md table{width:100%;border-collapse:collapse;margin:12px 0 18px;font-size:13.5px}
.md th,.md td{border:1px solid var(--line);padding:8px 10px;vertical-align:top}
.md th{background:#101820;color:var(--dim);font-weight:500}
.md td{color:var(--muted)}
.md pre{background:#10171f;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto}
.md code{font-family:var(--mono);font-size:.9em;color:var(--facts)}
.md pre code{color:var(--ink)}
.md hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.md ul,.md ol{padding-left:22px}
.md li{margin:4px 0}
.md a{color:var(--graph)}
.orig{font-family:var(--mono);font-size:11px;color:var(--dim);margin:0 0 14px}
.empty{color:var(--red)}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="kicker">repo-guard · 规范</div>
      <h1>开发阶段控制面</h1>
    </div>
    <nav class="tree" id="tree"></nav>
  </aside>
  <main class="main">
    <div class="orig" id="src"></div>
    <div class="page-wrap md" id="view">加载中…</div>
    <footer>技能库 markdown 为后端原文，未改内容。改 md 后运行 <code>python3 gen_contents.py</code> 可更新 file:// 回退包。</footer>
  </main>
</div>
<script src="contents.js"></script>
<script>
const MENU = [
  {id:"overview", title:"总览", file:"md/overview.md"},
  {group:"知识库", color:"var(--facts)", items:[
    {id:"facts", title:"工程事实", file:"md/facts.md"}
  ]},
  {group:"Agent harness", color:"var(--red)", items:[
    {id:"redline", title:"红线", file:"md/redline.md"},
    {id:"graph", title:"图谱", file:"md/graph.md"},
    {id:"process", title:"过程门禁", file:"md/process.md"}
  ]},
  {group:"人审", color:"var(--human)", items:[
    {id:"human", title:"人决策配置", file:"md/human.md"}
  ]},
  {group:"工程", color:"var(--merge)", items:[
    {id:"merge", title:"合并门禁", file:"md/merge.md"},
    {id:"gates", title:"门禁索引 G-01～G-07", file:"md/00-gate-index.md", original:true}
  ]},
  {group:"技能库", color:"var(--skill)", items:[
    {id:"sk01", title:"编码基线", file:"md/skills/01-coding-baseline.md", original:true},
    {id:"sk02", title:"错误处理", file:"md/skills/02-error-handling.md", original:true},
    {id:"sk03", title:"变更纪律与兼容性", file:"md/skills/03-change-compatibility.md", original:true},
    {id:"sk04", title:"接口契约", file:"md/skills/04-api-contract.md", original:true},
    {id:"sk05", title:"服务发现与路由", file:"md/skills/05-discovery-routing.md", original:true},
    {id:"sk06", title:"韧性治理", file:"md/skills/06-resilience.md", original:true},
    {id:"sk07", title:"可观测性", file:"md/skills/07-observability.md", original:true},
    {id:"sk08", title:"配置与多环境管理", file:"md/skills/08-config-environment.md", original:true},
    {id:"sk09", title:"数据与存储", file:"md/skills/09-data-storage.md", original:true},
    {id:"sk10", title:"工程文档", file:"md/skills/10-engineering-docs.md", original:true},
    {id:"sk11", title:"质量与测试", file:"md/skills/11-quality-testing.md", original:true},
    {id:"sk12", title:"自我评审", file:"md/skills/12-self-review.md", original:true},
    {id:"sk13", title:"交付与发布", file:"md/skills/13-delivery-release.md", original:true},
    {id:"sk14", title:"安全基线", file:"md/skills/14-security-baseline.md", original:true},
    {id:"sk15", title:"AI 执行纪律", file:"md/skills/15-ai-execution-discipline.md", original:true},
    {id:"component", title:"组件规范", file:"md/component.md"},
    {id:"ui", title:"UI 规范", file:"md/ui.md"}
  ]}
];

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function inline(s){
  s = esc(s);
  s = s.replace(/\*\*`([^`]+)`\*\*/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, "<a href=\"$2\">$1</a>");
  return s;
}
function renderMarkdown(src){
  src = (src || "").replace(/\r\n/g, "\n");
  var fences = [];
  src = src.replace(/```[\w-]*\n([\s\S]*?)```/g, function(_, code){
    var i = fences.length;
    fences.push("<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>");
    return "\n%%FENCE" + i + "%%\n";
  });
  var lines = src.split("\n");
  var out = [];
  var para = [];
  var i = 0;
  function flush(){
    if (!para.length) return;
    out.push("<p>" + inline(para.join(" ")) + "</p>");
    para = [];
  }
  function isSep(line){
    return /^\s*\|?(\s*:?-{2,}:?\s*\|)+\s*:?-{2,}:?\s*\|?\s*$/.test(line);
  }
  while (i < lines.length){
    var line = lines[i];
    var tline = line.trim();
    if (!tline){ flush(); i++; continue; }
    var fm = tline.match(/^%%FENCE(\d+)%%$/);
    if (fm){ flush(); out.push(fences[+fm[1]]); i++; continue; }
    if (/^---+$/.test(tline)){ flush(); out.push("<hr/>"); i++; continue; }
    var hm = tline.match(/^(#{1,6})\s+(.*)$/);
    if (hm){ flush(); out.push("<h" + hm[1].length + ">" + inline(hm[2]) + "</h" + hm[1].length + ">"); i++; continue; }
    if (tline.charAt(0) === ">"){
      flush();
      var qs = [];
      while (i < lines.length && lines[i].trim().charAt(0) === ">"){
        qs.push(lines[i].replace(/^\s*>\s?/, ""));
        i++;
      }
      out.push("<blockquote>" + inline(qs.join(" ")) + "</blockquote>");
      continue;
    }
    if (tline.indexOf("|") !== -1 && i + 1 < lines.length && isSep(lines[i+1])){
      flush();
      var rows = [];
      while (i < lines.length && lines[i].indexOf("|") !== -1){
        if (isSep(lines[i])){ i++; continue; }
        var cells = lines[i].replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(function(c){ return c.trim(); });
        rows.push(cells);
        i++;
      }
      if (rows.length){
        var h = "<table><thead><tr>" + rows[0].map(function(c){ return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
        for (var r = 1; r < rows.length; r++) h += "<tr>" + rows[r].map(function(c){ return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
        out.push(h + "</tbody></table>");
      }
      continue;
    }
    var ul = tline.match(/^[-*]\s+(.*)$/);
    var ol = tline.match(/^\d+\.\s+(.*)$/);
    if (ul || ol){
      flush();
      var ordered = !!ol;
      var items = [];
      while (i < lines.length){
        var tt = lines[i].trim();
        var m = ordered ? tt.match(/^\d+\.\s+(.*)$/) : tt.match(/^[-*]\s+(.*)$/);
        if (!m) break;
        items.push("<li>" + inline(m[1]) + "</li>");
        i++;
      }
      out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>"));
      continue;
    }
    para.push(tline);
    i++;
  }
  flush();
  return out.join("\n");
}

function buildTree(){
  const nav = document.getElementById("tree");
  let html = "<div class=\"g\">开始</div>";
  MENU.forEach(function(node){
    if (node.file){
      html += "<a href=\"#"+node.id+"\" data-file=\""+node.file+"\" data-id=\""+node.id+"\">"+node.title+"</a>";
      return;
    }
    html += "<details open><summary><span class=\"chev\">▶</span><span class=\"dot\" style=\"background:"+node.color+"\"></span>"+node.group+"</summary><div class=\"kids\">";
    node.items.forEach(function(it){
      html += "<a href=\"#"+it.id+"\" data-file=\""+it.file+"\" data-id=\""+it.id+"\" data-original=\""+(it.original?"1":"")+"\">"+it.title+"</a>";
    });
    html += "</div></details>";
  });
  nav.innerHTML = html;
}
function findItem(id){
  for (let i=0;i<MENU.length;i++){
    const n = MENU[i];
    if (n.id === id) return n;
    if (n.items){
      for (let j=0;j<n.items.length;j++) if (n.items[j].id === id) return n.items[j];
    }
  }
  return MENU[0];
}
async function loadFile(file){
  if (window.MD_FILES && Object.prototype.hasOwnProperty.call(window.MD_FILES, file)) return window.MD_FILES[file];
  const r = await fetch(file);
  if (!r.ok) throw new Error("HTTP "+r.status);
  return await r.text();
}
async function go(id){
  const item = findItem(id);
  document.querySelectorAll(".tree a").forEach(function(a){ a.classList.toggle("on", a.getAttribute("data-id")===item.id); });
  const src = document.getElementById("src");
  const view = document.getElementById("view");
  src.textContent = (item.original ? "后端原文 · 未改内容 · " : "") + item.file;
  try {
    const md = await loadFile(item.file);
    view.innerHTML = renderMarkdown(md);
  } catch (e) {
    view.innerHTML = "<p class=\"empty\">无法读取 "+esc(item.file)+"（"+esc(e.message)+"）。请用本地静态服务打开本目录，或确认 contents.js 已生成。</p>";
  }
  window.scrollTo(0,0);
}
buildTree();
document.getElementById("tree").addEventListener("click", function(e){
  const a = e.target.closest("a[data-id]");
  if (!a) return;
  e.preventDefault();
  const id = a.getAttribute("data-id");
  history.replaceState(null, "", "#"+id);
  go(id);
});
window.addEventListener("hashchange", function(){ go((location.hash||"#overview").slice(1)); });
go((location.hash||"#overview").slice(1));
</script>
</body>
</html>
